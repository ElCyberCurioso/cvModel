# Publica el CV en GitHub Pages regenerando antes la versión legible por IA/ATS
# (HTML estático, cv.*.md, resume*.json, llms.txt) a partir de data/cv.js.
# Activar en el repositorio: Settings → Pages → Source: "GitHub Actions".
name: Deploy CV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build (prerender + Markdown + JSON Resume)
        run: node tools/build.js
      - name: Prepare site
        run: |
          mkdir _site
          cp -r index.html assets data cv.*.md resume*.json llms.txt robots.txt .nojekyll _site/
          if [ -f sitemap.xml ]; then cp sitemap.xml _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
